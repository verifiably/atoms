name: Release

# Tagged `v<version>`, not nodes' `core/v*`: that prefix named the `-core` suffix the
# stack has now dropped, and this repository ships exactly one distribution.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check the tag matches the manifest
        run: |
          PY_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG_VERSION="${GITHUB_REF#refs/tags/v}"
              if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
                echo "tag v$TAG_VERSION does not match manifest version $PY_VERSION"
                exit 1
              fi
              ;;
          esac
          echo "version ok: $PY_VERSION"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - name: Build the distributions
        working-directory: python
        run: |
          rm -rf dist
          uv build --no-create-gitignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  verify-artifacts:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      # A PyPI upload cannot be taken back, so the artefacts are inspected and installed
      # before anything is sent: contents and metadata, then a real install of both the
      # wheel and the sdist, the sdist half proving it still rebuilds from source.
      - run: python3 .github/scripts/verify_python_artifacts.py dist
      - run: .github/scripts/smoke_install_python.sh dist
      - name: PyPI publish dry-run
        run: uv publish --dry-run --trusted-publishing never dist/*.whl dist/*.tar.gz

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [gates, build, verify-artifacts]
    runs-on: ubuntu-latest
    # Must match the PyPI trusted publisher exactly, or the OIDC claim is rejected.
    # Add required reviewers to this environment in repository settings for an approval
    # gate; naming it here narrows who can publish, but does not itself gate anything.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - name: Generate PyPI attestations
        run: uvx --from pypi-attestations==0.0.29 python -m pypi_attestations sign dist/*.whl dist/*.tar.gz
      - name: Validate the signed upload set
        run: uv publish --dry-run --trusted-publishing never
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
