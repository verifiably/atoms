name = "atoms"
aliases = []
purpose = "A recoverable filesystem effect engine: the crash-safe substrate"
abstract = """
Changes many files on disk as one unit, for programs that keep their records as files. It writes down what it is about to do before touching anything, so after a crash, a kill or another program writing mid-way it can tell from the disk alone which changes were its own, then finish or undo them, or halt and keep the evidence. One host and cooperating processes only; beliefs is its consumer.
"""
